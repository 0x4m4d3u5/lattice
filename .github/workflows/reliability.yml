name: Reliability baseline
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  baseline:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      MOON_HOME: ${{ github.workspace }}/.ci-moon
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26.10.0'
          package-manager-cache: false
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: toolchain
        with:
          path: ${{ env.MOON_HOME }}
          key: moon-${{ runner.os }}-${{ runner.arch }}-node26.10.0-${{ hashFiles('scripts/install-ci-toolchain.sh', 'scripts/verify-ci-toolchain.sh') }}
      - name: Set up repository toolchain
        run: |
          bash scripts/install-ci-toolchain.sh
          echo "$MOON_HOME/bin" >> "$GITHUB_PATH"
      - name: Resolve declared dependencies
        run: moon update
      - name: Check, test, and build
        run: bash scripts/check-baseline.sh
      - name: Portable WASM core smoke test
        run: bash scripts/check-wasm-core.sh
      - name: Supplied-text WASM GC note renderer
        run: bash scripts/check-wasm-note.sh
