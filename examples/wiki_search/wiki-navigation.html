<a class="skip" href="#lattice-main-content">Skip to content</a>
<header class="masthead">
  <a class="brand" href="/static/search/"><span class="mark" aria-hidden="true">L</span><span><strong>Lattice</strong> / Wiki</span></a>
  <button id="lattice-navigation-toggle" type="button" aria-controls="lattice-navigation" aria-expanded="false" hidden>Browse &amp; search</button>
  <span class="edition">Notes, connected.</span>
</header>
<aside id="lattice-navigation" class="search-column" aria-label="Wiki navigation">
  <a class="overview-link" href="/static/search/">Overview <span aria-hidden="true">←</span></a>
  <form id="lattice-search" role="search" aria-label="Wiki search" data-index="/content-index.json">
    <fieldset id="lattice-controls" disabled>
      <label for="lattice-query">Search notes</label>
      <div class="query"><input id="lattice-query" type="search" autocomplete="off" placeholder="Find a passage…"><button type="submit">Search</button></div>
      <details id="lattice-filters" hidden><summary>Filter by tags</summary><fieldset><legend>Match all selected</legend><div id="lattice-tags"></div></fieldset></details>
      <button id="lattice-clear-tags" type="button" hidden>Clear tag filters</button>
    </fieldset>
  </form>
  <p id="lattice-status" role="status" aria-live="polite">Loading wiki…</p>
  <button id="lattice-retry" type="button" hidden>Retry loading search</button>
  <ol id="lattice-results" aria-label="Matching sections" aria-busy="true"></ol>
  <nav id="lattice-page-navigation" aria-label="Pages by collection"></nav>
  <noscript>Enable JavaScript for the page directory and search. Published page links still work.</noscript>
</aside>
