<header class="masthead">

  <button id="navigation-toggle" type="button" aria-controls="navigation" aria-expanded="false" hidden>Browse &amp; search</button>
  <span class="edition">Notes, connected.</span>
</header>
<aside id="navigation" class="search-column" aria-label="Wiki navigation">

      <label for="query">Search notes</label>

  <p id="status" role="status" aria-live="polite">Loading wiki…</p>
  <button id="retry" type="button" hidden>Retry loading search</button>
  <ol id="results" aria-label="Matching sections" aria-busy="true"></ol>
